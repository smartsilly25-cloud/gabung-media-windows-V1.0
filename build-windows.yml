name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan proyek Windows
        shell: pwsh
        run: |
          Copy-Item lib "$env:RUNNER_TEMP\lib_bak" -Recurse
          Copy-Item pubspec.yaml "$env:RUNNER_TEMP\pubspec_bak.yaml"
          flutter create --platforms=windows --project-name gabung_media --org com.gabung .
          Remove-Item lib -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\lib_bak" lib -Recurse
          Copy-Item "$env:RUNNER_TEMP\pubspec_bak.yaml" pubspec.yaml -Force
          if (Test-Path test) { Remove-Item test -Recurse -Force }

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Sertakan FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $rel = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force "$rel\ffmpeg" | Out-Null
          Copy-Item "ffmpeg_tmp\*\bin\ffmpeg.exe" "$rel\ffmpeg\"
          Copy-Item "ffmpeg_tmp\*\bin\ffprobe.exe" "$rel\ffmpeg\"

      - uses: actions/upload-artifact@v4
        with:
          name: GabungMedia-Windows
          path: build/windows/x64/runner/Release
